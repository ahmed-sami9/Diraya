<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- .ico for older browsers; modern ones use the SVG. -->
    <link
      rel="icon"
      href="/favicon.ico"
      sizes="any"
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/favicon.svg"
    />
    <link
      rel="apple-touch-icon"
      href="/apple-touch-icon.png"
    />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Diraya · Management for private tutors</title>
    <meta
      name="description"
      content="Students, groups, attendance, exams, marks and payments in one place, for private tutors."
    />
    <!-- The browser bar's colour on phones: the page background in each theme. -->
    <meta
      name="theme-color"
      content="#f6f7fb"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#14162b"
      media="(prefers-color-scheme: dark)"
    />
    <!-- Link previews (LinkedIn, WhatsApp...). og:image needs the live address: add it at deploy. -->
    <meta
      property="og:type"
      content="website"
    />
    <meta
      property="og:site_name"
      content="Diraya"
    />
    <meta
      property="og:title"
      content="Diraya · Management for private tutors"
    />
    <meta
      property="og:description"
      content="Students, groups, attendance, exams, marks and payments in one place. Try the demo, no sign-up needed."
    />
    <!-- Sets the theme before the first paint, so dark mode never flashes white.
         Keep the key and default in sync with src/utils/theme.ts. -->
    <script>
      (function () {
        try {
          var preference = localStorage.getItem('diraya-theme');
          var dark =
            preference === 'dark' ||
            (preference === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        } catch (error) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script
      type="module"
      src="/src/main.tsx"
    ></script>
  </body>
</html>
